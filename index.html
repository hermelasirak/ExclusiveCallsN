        var choice = null;

        try { choice = localStorage.getItem('ecalls_cookie_consent'); } catch (e) {}

          if (/(?:^|;\s*)ecalls_gpc=1(?:;|$)/.test(document.cookie)) gpc = true;
        } catch (e) {}
        if (gpc && choice !== 'rejected') {
          choice = 'rejected';
          try { localStorage.setItem('ecalls_cookie_consent', 'rejected'); } catch (e) {}
        }
        var ads = choice === 'accepted' ? 'granted' : 'denied';
        gtag('consent', 'default', {
          ad_storage: ads,
          ad_user_data: ads,
          ad_personalization: ads,
          analytics_storage: 'granted',
          functionality_storage: 'granted',
          security_storage: 'granted',
          wait_for_update: 500
        });
      })();
    </script>
